<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mitgemischt – Busfahrer</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;color:#202124;background:#f4f4f6}body{margin:0}header{background:#124637;color:white;padding:22px 18px}main{max-width:520px;margin:auto;padding:18px}h1{margin:4px 0}h2{font-size:1.35rem}button{border:1px solid #235b4a;border-radius:14px;padding:15px 12px;font-size:1.1rem;background:white;color:#164b3a;min-height:54px}button.primary{background:#165a42;color:white;width:100%}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.panel{background:white;border-radius:18px;padding:18px;margin:12px 0}.scores{display:flex;justify-content:space-around;gap:6px}.scores span{text-align:center}.card{width:80px;height:112px;border:3px solid #235b4a;border-radius:12px;display:grid;place-items:center;font-size:2rem;margin:18px auto;background:white}.muted{color:#555}.pyr{display:flex;justify-content:center;gap:5px;margin:6px}.pyr span{background:#195a44;color:white;border-radius:5px;padding:10px}.pyr span.open{background:#e4f2e9;color:#15563d}#message{font-weight:600;min-height:2em}button:focus-visible{outline:4px solid #ffb600;outline-offset:2px}</style><header><small>MITGEMISCHT · KONZEPT</small><h1>Busfahrer</h1><div id="subtitle">Interaktiver Prototyp · 3 Spieler</div></header><main><div id="score" class="panel" aria-live="polite"></div><section id="screen" class="panel"></section><p id="message" role="status" aria-live="polite"></p></main><script>
const names=['Bruno','Anna','Chris'],qs=[['Rot oder Schwarz?',['Rot','Schwarz'],'Rot','♥ 8'],['Höher oder tiefer?',['Höher','Tiefer'],'Höher','♠ K'],['Dazwischen oder außerhalb?',['Dazwischen','Außerhalb'],'Dazwischen','♦ 10'],['Welches Symbol?',['Herz','Karo','Pik','Kreuz'],'Kreuz','♣ 4']];
let phase='start',round=1,player=0,step=0,points=[0,0,0],hands=[4,4,4],pyr=0,station=0,driver=0,fail=0,msg='';
const el=id=>document.getElementById(id),btn=(label,action,primary=false)=>'<button '+(primary?'class="primary" ':'')+'onclick="'+action+'">'+label+'</button>';
function render(){el('score').innerHTML='<b>Gesamtstand · Strafpunkte</b><div class="scores">'+names.map((n,i)=>'<span>'+n+'<br><strong>'+points[i]+'</strong></span>').join('')+'</div>';el('subtitle').textContent='Runde '+round+' von 5 · '+({start:'Start',ask:'Vorhersagen',result:'Karte aufgedeckt',pyramid:'Pyramide',select:'Busfahrer bestimmen',tie:'Stechen',final:'Busfahrt',end:'Rundenergebnis',done:'Partie beendet'}[phase]);el('message').textContent=msg;let s='';
if(phase==='start')s='<h2>Neue Partie</h2><p>Vier Vorhersagen pro Person, danach Pyramide und Busfahrt. Niedrigster Gesamtstand gewinnt.</p>'+btn('Partie starten','start()',true);
if(phase==='ask'){let q=qs[step];s='<p>'+names[player]+' · Frage '+(step+1)+' von 4</p><h2>'+q[0]+'</h2><div class="card" aria-label="Verdeckte Karte">?</div><div class="grid">'+q[1].map((o,i)=>btn(o,'answer('+i+')')).join('')+'</div>'}
if(phase==='result')s='<h2>Karte aufgedeckt</h2><div class="card">'+qs[step][3]+'</div>'+btn('Weiter','next()',true);
if(phase==='pyramid'||phase==='select'){s='<h2>Kartenpyramide</h2><p>Passende Handkarten werden hier beispielhaft automatisch abgelegt.</p>';let k=0;for(let row=1;row<=4;row++){s+='<div class="pyr">';for(let j=0;j<row;j++){s+='<span class="'+(k<pyr?'open':'')+'">'+(k<pyr?'♥':'?')+'</span>';k++}s+='</div>'}s+='<p>Aufgedeckt: '+pyr+' von 10</p><p>Handkarten: '+names.map((n,i)=>n+' '+hands[i]).join(' · ')+'</p>'+btn(phase==='pyramid'?'Nächste Karte aufdecken':'Busfahrer bestimmen',phase==='pyramid'?'reveal()':'selectDriver()',true)}
if(phase==='tie')s='<h2>Gleichstand – Stechen</h2><p>Alle gleichstehenden Spieler ziehen eine Entscheidungskarte. Der niedrigste Kartenwert bestimmt den Busfahrer.</p>'+btn('Entscheidungskarten ziehen','tie()',true);
if(phase==='final'){let q=qs[station];s='<h2>Busfahrt · '+names[driver]+'</h2><p>Station '+(station+1)+' von 4 · Fehlversuche: '+fail+'</p><h2>'+q[0]+'</h2><div class="grid">'+q[1].map((o,i)=>btn(o,'drive('+i+')')).join('')+'</div><p class="muted">Falsch: +1 Strafpunkt und Neustart bei Station 1. Keine Obergrenze.</p>'}
if(phase==='end')s='<h2>Busfahrt geschafft!</h2><p>'+names[driver]+' hat alle Stationen abgeschlossen. Fehlversuche: '+fail+'</p>'+btn(round<5?'Nächste Runde':'Gesamtergebnis',round<5?'newRound()':'finish()',true);
if(phase==='done'){let min=Math.min(...points);s='<h2>Partie beendet</h2><p>Gewonnen: '+names.filter((n,i)=>points[i]===min).join(' und ')+' mit '+min+' Strafpunkten.</p>'+btn('Neue Partie','start()',true)}
el('screen').innerHTML=s}
function start(){round=1;points=[0,0,0];newRound(true)}
function newRound(first=false){if(!first)round++;phase='ask';player=0;step=0;hands=[4,4,4];pyr=0;station=0;fail=0;msg='';render()}
function answer(i){let q=qs[step],ok=q[1][i]===q[2];if(!ok)points[player]++;msg=names[player]+': '+q[3]+'. '+(ok?'Richtig.':'Falsch, ein Strafpunkt.');phase='result';render()}
function next(){msg='';if(step<3)step++;else if(player<2){player++;step=0}else{phase='pyramid';render();return}phase='ask';render()}
function reveal(){const targets=[1,0,2,1,0,2,0,1,2,0];hands[targets[pyr]]=Math.max(0,hands[targets[pyr]]-1);pyr++;msg='Pyramidenkarte '+pyr+' aufgedeckt.';if(pyr===10)phase='select';render()}
function selectDriver(){let m=Math.max(...hands),t=hands.map((v,i)=>v===m?i:-1).filter(i=>i>=0);if(t.length>1){phase='tie';msg='Gleichstand: '+t.map(i=>names[i]).join(' und ')}else{driver=t[0];phase='final';msg=names[driver]+' fährt Bus.'}render()}
function tie(){let m=Math.max(...hands),t=hands.map((v,i)=>v===m?i:-1).filter(i=>i>=0);driver=t[t.length-1];phase='final';msg='Stechen simuliert: '+names[driver]+' zieht den niedrigsten Wert.';render()}
function drive(i){let q=qs[station],ok=q[1][i]===q[2];if(ok){station++;msg='Richtig, nächste Station.';if(station===4)phase='end'}else{points[driver]++;fail++;station=0;msg='Falsch. +1 Strafpunkt. Neustart bei Station 1.'}render()}
function finish(){phase='done';msg='';render()}render();
</script></html>

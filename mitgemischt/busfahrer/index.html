const names=['Bruno','Anna','Chris'],suits=['♥','♦','♠','♣'],questions=['Rot oder Schwarz?','Höher oder tiefer?','Dazwischen oder außerhalb?','Herz, Karo, Pik oder Kreuz?'];let phase='start',round=1,turn=0,question=0,scores=[0,0,0],hands=[[],[],[]],history=[[],[],[]],pyr=[],pyrIndex=0,driver=0,station=0,failures=0,last=null,feedback='',tieList=[],tieDraws=[],nextTick=0;
const el=id=>document.getElementById(id),value=c=>c.n,red=s=>s==='♥'||s==='♦',rand=n=>Math.floor(Math.random()*n),deck=()=>{let d=[];for(let s of suits)for(let n=2;n<=14;n++)d.push({s,n});for(let i=d.length-1;i>0;i--){let j=rand(i+1);[d[i],d[j]]=[d[j],d[i]]}return d},cardName=c=>!c?'verdeckt':(c.n===14?'Ass':c.n===13?'König':c.n===12?'Dame':c.n===11?'Bube':c.n)+' '+({'♥':'Herz','♦':'Karo','♠':'Pik','♣':'Kreuz'}[c.s]),short=n=>({14:'A',13:'K',12:'D',11:'B'}[n]||n),back=()=>'<div class="playing back" aria-label="Verdeckte Karte"><div class="pattern" aria-hidden="true">'+Array(20).fill('<span>▽</span>').join('')+'</div></div>',card=(c,cls='')=>'<div class="playing '+(red(c.s)?'red':'black')+' '+cls+'" role="img" aria-label="'+cardName(c)+'"><span class="corner" aria-hidden="true">'+short(c.n)+'<br>'+c.s+'</span><span class="pip" aria-hidden="true">'+c.s+'</span><span class="corner bottom" aria-hidden="true">'+short(c.n)+'<br>'+c.s+'</span></div>',btn=(label,fn)=>'<button class="primary" type="button" onclick="'+fn+'">'+label+'</button>',choices=(arr)=>'<div class="actions">'+arr.map((a,i)=>'<button class="action" type="button" aria-label="'+a.label+'" onclick="select('+i+')">'+(a.html||card(a.c))+'<span>'+a.label+'</span></button>').join('')+'</div>';
let draw=deck(),current=null,pyrPlayer=0,pyrDealer=0,pyrEvents=[];function take(){if(!draw.length)draw=deck();return draw.pop()}function resetRound(){phase='ask';turn=0;question=0;history=[[],[],[]];hands=[[],[],[]];pyr=[];pyrIndex=0;pyrPlayer=0;pyrDealer=0;pyrEvents=[];station=0;failures=0;feedback='';draw=deck();current=take();render()}function start(){round=1;scores=[0,0,0];resetRound()}function questionChoices(){let q=phase==='final'?station:question;let prev=phase==='final'?finalHistory:history[turn];if(q===0)return [{label:'Rot',c:{s:'♥',n:14}},{label:'Schwarz',c:{s:'♠',n:14}}];if(q===1)return[{label:'Höher',c:{s:'♥',n:Math.min(14,prev[0].n+1)}},{label:'Tiefer',c:{s:'♠',n:Math.max(2,prev[0].n-1)}}];if(q===2){let lo=Math.min(prev[0].n,prev[1].n),hi=Math.max(prev[0].n,prev[1].n);return[{label:'Dazwischen',html:card({s:'♥',n:Math.max(2,Math.min(14,Math.floor((lo+hi)/2)))})},{label:'Außerhalb',html:card({s:'♠',n:hi<14?14:2})}]}return suits.map(s=>({label:({'♥':'Herz','♦':'Karo','♠':'Pik','♣':'Kreuz'}[s]),c:{s,n:14}}))}

function select(i){if(phase!=='ask'&&phase!=='final')return;const isFinal=phase==='final',q=isFinal?station:question,p=isFinal?driver:turn,prev=isFinal?finalHistory:history[turn],c=current,ok=correct(i,c,prev,q),label=questionChoices()[i]?.label||'';if(isFinal){if(!ok){scores[p]++;failures++}else finalHistory.push(c)}else{if(!ok)scores[p]++;history[p].push(c);hands[p].push(c)}last={p,c,ok,label,isFinal,q};feedback=names[p]+' hat '+label+' gewählt. '+cardName(c)+'. '+(ok?'Richtig.':'Falsch, ein Strafpunkt.');phase='result';render()}
function next(){if(phase!=='result')return;if(last.isFinal){if(last.ok){station++;if(station===4){phase='roundEnd';render();return}}else{station=0;finalHistory=[]}phase='final';current=take();render();return}if(turn<2)turn++;else{turn=0;question++}if(question===4){phase='pyramid';pyr=Array.from({length:10},()=>take());pyrIndex=0;pyrDealer=0;pyrPlayer=0;pyrEvents=[];feedback='';render();return}current=take();phase='ask';feedback='';render()}

function finishPlayer(){if(phase!=='pyramidOffer')return;if(pyrPlayer<names.length-1){pyrPlayer++;feedback=names[pyrPlayer]+' prüft die eigenen Handkarten.';render()}else{phase='pyramidResult';feedback='Alle haben ihre Ablage abgeschlossen. '+(pyrEvents.length?pyrEvents.join(' '):'Niemand hat eine Karte abgelegt.');render()}}

function chooseDriver(){let max=Math.max(...hands.map(x=>x.length));tieList=hands.map((x,i)=>x.length===max?i:-1).filter(i=>i>=0);if(tieList.length>1){phase='tie';tieDraws=[]}else{driver=tieList[0];beginFinal()}render()}
function drawTie(){const drawn=tieList.map(i=>({i,c:take()})),min=Math.min(...drawn.map(x=>x.c.n));tieDraws=drawn;const remaining=drawn.filter(x=>x.c.n===min).map(x=>x.i);if(remaining.length===1){driver=remaining[0];phase='tieResult'}else{tieList=remaining;phase='tieRepeat'}render()}
let finalHistory=[];function beginFinal(){phase='final';station=0;failures=0;finalHistory=[];current=take();feedback='';render()}function newRound(){round++;resetRound()}function end(){phase='done';render()}function showPoints(){el('modalTitle').textContent='Gesamtpunktestand';el('modalBody').innerHTML='<div class="scores">'+names.map((n,i)=>'<div>'+n+'<strong>'+scores[i]+'</strong>Strafpunkte</div>').join('')+'</div><p>Weniger Strafpunkte sind besser. Keine Begrenzung im Finale.</p>';el('modal').showModal()}
function render(){let status='',sub='',s='';const roundText='Runde '+round+' von 5';if(phase==='start'){status='Busfahrer';sub='Konzeptansicht · 3 Spieler';s='<div class="panel"><h2>Neue Partie</h2><p>Vier Vorhersagen reihum, danach Pyramide und Busfahrt. Die anderen Spieler werden im Prototyp auf demselben Bildschirm bedient.</p>'+btn('Partie starten','start()')+'</div>'}
if(phase==='ask'){status=names[turn]+' ist dran.';sub=roundText+' · Frage '+(question+1)+' von 4';s='<div class="panel"><div class="four-cards" role="group" aria-label="Vier Vorhersagekarten von '+names[turn]+'">'+Array.from({length:4},(_,i)=>'<div class="four-slot">'+(history[turn][i]?card(history[turn][i],'small'):back())+'</div>').join('')+'</div>'+choices(questionChoices())+'</div>'}
if(phase==='result'){status=names[last.p]+': '+(last.ok?'Richtig.':'Falsch, ein Strafpunkt.');sub=roundText+' · '+cardName(last.c);s='<div class="panel"><div class="four-cards" role="group" aria-label="Vier Vorhersagekarten von '+names[last.p]+'">'+Array.from({length:4},(_,i)=>'<div class="four-slot">'+(last.isFinal?(finalHistory[i]?card(finalHistory[i],'small'):i===last.q?card(last.c,'small'):back()):(history[last.p][i]?card(history[last.p][i],'small'):back()))+'</div>').join('')+'</div>'+btn('Weiter','next()')+'</div>'}
if(['pyramid','pyramidOffer','pyramidResult','selectDriver'].includes(phase)){const c=pyr[pyrIndex-1],viewing=phase==='pyramidOffer'?pyrPlayer:pyrDealer,hview=hands[viewing],canLay=phase==='pyramidOffer';status=phase==='pyramid'?names[pyrDealer]+': Pyramidenkarte aufdecken.':phase==='pyramidOffer'?names[pyrPlayer]+' ist dran.':phase==='pyramidResult'?'Alle haben entschieden.': 'Busfahrer bestimmen.';sub=roundText+' · Pyramide '+pyrIndex+' von 10';let idx=0;s='<div class="panel pyramid-panel"><div class="pyramid" aria-label="Kartenpyramide">'+[1,2,3,4].map(n=>'<div class="pyrrow">'+Array.from({length:n},()=>{let i=idx++;return i<pyrIndex?card(pyr[i],'small'):back()}).join('')+'</div>').join('')+'</div><div class="hand" role="group" aria-label="Handkarten von '+names[viewing]+'">'+hview.map((x,i)=>'<button type="button" class="hand-choice" '+(!canLay||x.n!==c.n?'disabled aria-disabled="true"':'')+' onclick="layCard('+i+')" aria-label="'+cardName(x)+(canLay&&x.n===c.n?', auf Pyramide ablegen':', Handkarte')+'">'+card(x,'small')+'</button>').join('')+'</div>';if(phase==='pyramid')s+=btn('Karte aufdecken','reveal()');else if(phase==='pyramidOffer')s+=btn('Weiter','finishPlayer()');else if(phase==='pyramidResult')s+=btn('Weiter','afterReveal()');else s+=btn('Busfahrer bestimmen','chooseDriver()');s+='</div>'}
if(phase==='tie'||phase==='tieRepeat'||phase==='tieResult'){status=phase==='tieResult'?names[driver]+' wird Busfahrer.':'Gleichstand: Entscheidungskarte.';sub=roundText+' · Stechen';s='<div class="panel"><p>Die niedrigste Karte bestimmt den Busfahrer. Bei erneutem Gleichstand ziehen nur die Betroffenen noch einmal.</p>'+ (tieDraws.length?'<div class="center">'+tieDraws.map(x=>'<div style="text-align:center">'+card(x.c,'small')+'<p>'+names[x.i]+'</p></div>').join('')+'</div>':'')+(phase==='tieResult'?btn('Busfahrt beginnen','beginFinal()'):btn('Entscheidungskarten ziehen','drawTie()'))+'</div>'}
if(phase==='final'){status=names[driver]+' fährt Bus.';sub=roundText+' · Station '+(station+1)+' von 4 · '+questions[station];s='<div class="panel"><div class="center">'+back()+'</div><h2>Vorhersage wählen</h2>'+choices(questionChoices())+'<p class="progress">Fehlversuche: '+failures+' · Jeder Fehler: +1 Strafpunkt und Neustart</p></div>'}
if(phase==='roundEnd'){status='Busfahrt geschafft!';sub=roundText+' · Rundenergebnis';s='<div class="panel"><p>'+names[driver]+' hat alle vier Stationen geschafft. Fehlversuche: '+failures+'</p>'+btn(round<5?'Nächste Runde':'Gesamtergebnis',round<5?'newRound()':'end()')+'</div>'}
if(phase==='done'){let min=Math.min(...scores);status='Partie beendet.';sub='Fünf Runden gespielt';s='<div class="panel"><h2>Ergebnis</h2><p>'+names.filter((n,i)=>scores[i]===min).join(' und ')+' '+(scores.filter(x=>x===min).length===1?'gewinnt':'gewinnen')+' mit '+min+' Strafpunkten.</p>'+btn('Neue Partie','start()')+'</div>'}
el('status').textContent=status;el('sub').textContent=sub;el('screen').innerHTML=s;el('announce').textContent=feedback}
el('restart').onclick=()=>{if(confirm('Neue Partie starten?'))start()};const actionsButton=el('actionsButton'),actionsMenu=el('actionsMenu');function closeActions(){actionsMenu.classList.add('hidden');actionsButton.setAttribute('aria-expanded','false')}actionsButton.onclick=()=>{const opening=actionsMenu.classList.contains('hidden');actionsMenu.classList.toggle('hidden',!opening);actionsButton.setAttribute('aria-expanded',String(opening));if(opening)el('actionScore').focus()};el('actionScore').onclick=()=>{closeActions();showPoints()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeActions()});el('rules').onclick=()=>{el('modalTitle').textContent='Spielregeln';el('modalBody').innerHTML='<p>Alle Spieler beantworten vier Vorhersagen reihum. Falsche Antworten kosten einen Strafpunkt. Danach werden zehn Pyramidenkarten aufgedeckt. Wer die meisten Handkarten behält, fährt Bus. Bei Gleichstand entscheidet die niedrigste gezogene Karte. Jede falsche Vorhersage bei der Busfahrt kostet einen Strafpunkt und setzt die Fahrt auf Station 1 zurück. Nach fünf Runden gewinnt der niedrigste Gesamtstand.</p>';el('modal').showModal()};el('closeModal').onclick=()=>el('modal').close();render();

let finalHistory=[];function beginFinal(){phase='final';station=0;failures=0;finalHistory=[];current=take();feedback='';render()}function newRound(){round++;resetRound()}function end(){phase='done';render()}function showPoints(){el('modalTitle').textContent='Gesamtpunktestand';el('modalBody').innerHTML='<div class="scores" role="list">'+names.map((n,i)=>'<div role="listitem" aria-label="'+n+', '+scores[i]+' Strafpunkte"><span aria-hidden="true">'+n+'</span><strong aria-hidden="true">'+scores[i]+'</strong></div>').join('')+'</div>';el('modal').showModal()}
function render(){let status='',sub='',s='';const roundText='Runde '+round+' von 5';if(phase==='start'){status='Busfahrer';sub='Konzeptansicht · 3 Spieler';s='<div class="panel"><h2>Neue Partie</h2><p>Vier Vorhersagen reihum, danach Pyramide und Busfahrt. Die anderen Spieler werden im Prototyp auf demselben Bildschirm bedient.</p>'+btn('Partie starten','start()')+'</div>'}
if(phase==='ask'){status=names[turn]+' ist dran.';sub=roundText+' · Frage '+(question+1)+' von 4';s='<div class="panel"><div class="four-cards" role="group" aria-label="Vier Vorhersagekarten von '+names[turn]+'">'+Array.from({length:4},(_,i)=>'<div class="four-slot">'+(history[turn][i]?card(history[turn][i],'small'):back())+'</div>').join('')+'</div>'+choices(questionChoices())+'</div>'}
if(phase==='result'){status=names[last.p]+': '+(last.ok?'Richtig.':last.isFinal?'Falsch, 1 Strafpunkt. Busfahrt beginnt erneut.':'Falsch, 1 Strafpunkt.');sub=roundText+' · '+(last.isFinal?'Station '+(last.q+1)+' von 4':'Frage '+(last.q+1)+' von 4');s='<div class="panel"><div class="four-cards" role="group" aria-label="Vier Vorhersagekarten von '+names[last.p]+'">'+Array.from({length:4},(_,i)=>'<div class="four-slot">'+(last.isFinal?(finalHistory[i]?card(finalHistory[i],'small'):i===last.q?card(last.c,'small'):back()):(history[last.p][i]?card(history[last.p][i],'small'):back()))+'</div>').join('')+'</div>'+btn('Weiter','next()')+'</div>'}
if(['pyramid','pyramidOffer','pyramidResult','selectDriver'].includes(phase)){const c=pyr[pyrIndex-1],viewing=phase==='pyramidOffer'?pyrPlayer:pyrDealer,hview=hands[viewing],canLay=phase==='pyramidOffer';status=phase==='pyramid'?names[pyrDealer]+': Pyramidenkarte aufdecken.':phase==='pyramidOffer'?names[pyrPlayer]+' ist dran.':phase==='pyramidResult'?'Alle haben entschieden.': 'Busfahrer bestimmen.';sub=roundText+' · Pyramide '+pyrIndex+' von 10';const pyramidRows=[[9],[7,8],[4,5,6],[0,1,2,3]];s='<div class="panel pyramid-panel"><div class="pyramid" aria-label="Kartenpyramide">'+pyramidRows.map(row=>'<div class="pyrrow">'+row.map(i=>i<pyrIndex?card(pyr[i],'small'):back()).join('')+'</div>').join('')+'</div><div class="hand" role="group" aria-label="Handkarten von '+names[viewing]+'">'+hview.map((x,i)=>'<button type="button" class="hand-choice" '+(!canLay||x.n!==c.n?'aria-disabled="true"':'aria-disabled="false"')+' onclick="layCard('+i+')" aria-label="'+cardName(x)+(canLay&&x.n===c.n?', auf Pyramide ablegen':', Handkarte')+'">'+card(x,'small')+'</button>').join('')+'</div>';if(phase==='pyramid')s+=btn('Karte aufdecken','reveal()');else if(phase==='pyramidOffer')s+=btn('Weiter','finishPlayer()');else if(phase==='pyramidResult')s+=btn('Weiter','afterReveal()');else s+=btn('Busfahrer bestimmen','chooseDriver()');s+='</div>'}
if(phase==='tie'||phase==='tieRepeat'||phase==='tieResult'){status=phase==='tieResult'?names[driver]+' wird Busfahrer.':'Gleichstand: Entscheidungskarte.';sub=roundText+' · Stechen';s='<div class="panel"><p>Die niedrigste Karte bestimmt den Busfahrer. Bei erneutem Gleichstand ziehen nur die Betroffenen noch einmal.</p>'+ (tieDraws.length?'<div class="center">'+tieDraws.map(x=>'<div style="text-align:center">'+card(x.c,'small')+'<p>'+names[x.i]+'</p></div>').join('')+'</div>':'')+(phase==='tieResult'?btn('Busfahrt beginnen','beginFinal()'):btn('Entscheidungskarten ziehen','drawTie()'))+'</div>'}
if(phase==='final'){status=names[driver]+' fährt Bus.';sub=roundText+' · Station '+(station+1)+' von 4';s='<div class="panel"><div class="four-cards" role="group" aria-label="Vier Karten der Busfahrt">'+Array.from({length:4},(_,i)=>'<div class="four-slot">'+(finalHistory[i]?card(finalHistory[i],'small'):back())+'</div>').join('')+'</div>'+choices(questionChoices())+'</div>'}
if(phase==='roundEnd'){status='Busfahrt geschafft!';sub=roundText+' · Rundenergebnis';s='<div class="panel"><p>'+names[driver]+' hat alle vier Stationen geschafft. Fehlversuche: '+failures+'</p>'+btn(round<5?'Nächste Runde':'Gesamtergebnis',round<5?'newRound()':'end()')+'</div>'}
if(phase==='done'){let min=Math.min(...scores);status='Partie beendet.';sub='Fünf Runden gespielt';s='<div class="panel"><h2>Ergebnis</h2><p>'+names.filter((n,i)=>scores[i]===min).join(' und ')+' '+(scores.filter(x=>x===min).length===1?'gewinnt':'gewinnen')+' mit '+min+' Strafpunkten.</p>'+btn('Neue Partie','start()')+'</div>'}
el('status').textContent=status;el('sub').textContent=sub;el('screen').innerHTML=s;el('announce').textContent=feedback}
el('confirmDistribution').onclick=confirmDistribution;el('cancelDistribution').onclick=cancelDistribution;el('distributionModal').addEventListener('cancel',e=>{e.preventDefault();cancelDistribution()});el('restart').onclick=()=>{if(confirm('Neue Partie starten?'))start()};const actionsButton=el('actionsButton'),actionsMenu=el('actionsMenu');function closeActions(){actionsMenu.classList.add('hidden');actionsButton.setAttribute('aria-expanded','false')}actionsButton.onclick=()=>{const opening=actionsMenu.classList.contains('hidden');actionsMenu.classList.toggle('hidden',!opening);actionsButton.setAttribute('aria-expanded',String(opening));if(opening)el('actionScore').focus()};el('actionScore').onclick=()=>{closeActions();showPoints()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeActions()});el('rules').onclick=()=>{el('modalTitle').textContent='Spielregeln';el('modalBody').innerHTML='<p>Alle Spieler beantworten vier Vorhersagen reihum. Falsche Antworten kosten einen Strafpunkt. Danach werden zehn Pyramidenkarten von unten nach oben aufgedeckt. Für jede passende abgelegte Handkarte verteilt der Spieler je nach Reihe 1 bis 4 Strafpunkte an andere Spieler. Wer die meisten Handkarten behält, fährt Bus. Bei Gleichstand entscheidet die niedrigste gezogene Karte. Jede falsche Vorhersage bei der Busfahrt kostet einen Strafpunkt und setzt die Fahrt auf Station 1 zurück. Nach fünf Runden gewinnt der niedrigste Gesamtstand.</p>';el('modal').showModal()};el('closeModal').onclick=()=>el('modal').close();render();
</script></body></html>

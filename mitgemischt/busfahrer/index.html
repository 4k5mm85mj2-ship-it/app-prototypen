<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Busfahrer – Mitgemischt Konzept</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:light dark;--bg:#f2f2f7;--surface:#fff;--ink:#17171a;--muted:#606168;--line:#d8d8df;--blue:#123865;--focus:#4287e8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-size:17px}button{font:inherit;cursor:pointer}button:focus-visible{outline:4px solid var(--focus);outline-offset:3px}header{display:flex;align-items:center;justify-content:space-between;padding:12px 18px 4px;min-height:66px}header button{background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:50px;min-width:50px;min-height:50px;font-size:1.4rem}header .right{display:flex;gap:8px}main{max-width:640px;margin:auto;padding:6px 16px 38px}.status{font-size:1.3rem;font-weight:750;line-height:1.3;margin:12px 0 5px}.sub{font-size:.96rem;color:var(--muted);margin:0 0 16px}.panel{background:var(--surface);border-radius:22px;padding:17px;margin:12px 0}.panel h2{font-size:1.23rem;margin:0 0 12px}.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.action{background:transparent;border:2px solid transparent;border-radius:17px;min-height:165px;padding:8px 4px;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-weight:700}.action:active{background:var(--bg)}.action .playing{width:108px;height:139px}.playing{background:#fff;color:#141414;border:2px solid #141414;border-radius:12px;position:relative;box-shadow:2px 3px 0 #0002;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden}.playing.red{color:#ae0025}.playing.black{color:#101114}.playing .corner{position:absolute;left:8px;top:7px;font-size:1.1rem;font-weight:800;line-height:1.05;text-align:center}.playing .corner.bottom{left:auto;top:auto;right:8px;bottom:7px;transform:rotate(180deg)}.playing .pip{font-size:3.3rem;line-height:1}.playing .face{font-size:2.1rem;font-weight:800}.playing.back{background:#fff;padding:7px}.playing.back .pattern{width:100%;height:100%;background:#0e3666;border-radius:7px;display:grid;grid-template-columns:repeat(4,1fr);place-items:center;color:#fff;font-size:.8rem}.playing.back .pattern span{font-size:1rem}.playing.small{width:54px;height:76px;border-radius:7px}.playing.small .pip{font-size:1.7rem}.playing.small .corner{font-size:.75rem;left:4px;top:4px}.playing.small .corner.bottom{left:auto;top:auto;right:4px;bottom:4px}.playing.small .pattern{font-size:.5rem}.playing.small .pattern span{font-size:.55rem}.playing.large{width:135px;height:185px;margin:10px auto 18px}.playing.large .pip{font-size:4rem}.playing.large .face{font-size:2.7rem}.center{display:flex;justify-content:center;align-items:center;gap:14px;flex-wrap:wrap}.primary{width:100%;background:var(--ink);color:var(--bg);border:0;border-radius:14px;min-height:56px;font-weight:750;margin-top:14px}.secondary{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px;min-height:50px}.summary{background:var(--surface);padding:12px 16px;border-radius:16px;margin:12px 0;display:flex;align-items:center;justify-content:space-between;gap:12px}.summary button{border:0;background:transparent;color:var(--ink);font-weight:700;text-align:left;min-height:40px}.summary strong{font-size:1rem}.scores{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center;margin:12px 0}.scores strong{display:block;font-size:1.5rem}.note{background:var(--surface);border-radius:14px;padding:12px;margin:12px 0;line-height:1.45}.note strong{display:block}.pyramid{display:flex;flex-direction:column;align-items:center;gap:5px;margin:12px 0}.pyrrow{display:flex;gap:6px}.pyrrow .playing{width:55px;height:78px}.pyrrow .playing .pip{font-size:1.7rem}.pyrrow .playing .corner{font-size:.7rem}.pyrrow .playing .corner.bottom{left:auto;top:auto;right:4px;bottom:4px}.pyrrow .playing .pattern span{font-size:.6rem}.pyrrow .playing .pattern{font-size:.5rem}.progress{font-size:.9rem;color:var(--muted)}.hidden{display:none!important}#announce{line-height:1.45}dialog{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:20px;max-width:min(90vw,440px);padding:22px}dialog::backdrop{background:#0009}dialog h2{margin-top:0}footer{font-size:.8rem;color:var(--muted);text-align:center;margin-top:20px}@media(prefers-color-scheme:dark){:root{--bg:#000;--surface:#222224;--ink:#f6f6f6;--muted:#c0c0c6;--line:#4d4d51}.primary{color:#101010}.playing{color:#101010}}@media(max-width:360px){main{padding-inline:10px}.panel{padding:12px}.action .playing{width:92px;height:124px}.pyrrow .playing{width:47px;height:69px}.pyrrow{gap:4px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style></head><body><header><button type="button" id="restart" aria-label="Partie neu starten">↶</button><div class="right"><button type="button" id="rules" aria-label="Spielregeln">ⓘ</button><button type="button" id="points" aria-label="Gesamtpunktestand anzeigen">♧</button></div></header><main><div id="status" class="status" role="heading" aria-level="1"></div><p id="sub" class="sub"></p><div id="summary" class="summary"></div><section id="screen" aria-label="Spielbereich"></section><div id="announce" role="status" aria-live="polite" aria-atomic="true"></div><footer>Interaktives Konzept · Gegneraktionen simuliert · keine Verbindung zur App</footer></main><dialog id="modal"><h2 id="modalTitle">Spielstand</h2><div id="modalBody"></div><button class="primary" id="closeModal">Schließen</button></dialog><script>
const names=['Bruno','Anna','Chris'],suits=['♥','♦','♠','♣'],questions=['Rot oder Schwarz?','Höher oder tiefer?','Dazwischen oder außerhalb?','Herz, Karo, Pik oder Kreuz?'];let phase='start',round=1,turn=0,question=0,scores=[0,0,0],hands=[[],[],[]],history=[[],[],[]],pyr=[],pyrIndex=0,driver=0,station=0,failures=0,last=null,feedback='',tieList=[],tieDraws=[],nextTick=0;
const el=id=>document.getElementById(id),value=c=>c.n,red=s=>s==='♥'||s==='♦',rand=n=>Math.floor(Math.random()*n),deck=()=>{let d=[];for(let s of suits)for(let n=2;n<=14;n++)d.push({s,n});for(let i=d.length-1;i>0;i--){let j=rand(i+1);[d[i],d[j]]=[d[j],d[i]]}return d},cardName=c=>!c?'verdeckt':(c.n===14?'Ass':c.n===13?'König':c.n===12?'Dame':c.n===11?'Bube':c.n)+' '+({'♥':'Herz','♦':'Karo','♠':'Pik','♣':'Kreuz'}[c.s]),short=n=>({14:'A',13:'K',12:'D',11:'B'}[n]||n),back=()=>'<div class="playing back" aria-label="Verdeckte Karte"><div class="pattern" aria-hidden="true">'+Array(20).fill('<span>▽</span>').join('')+'</div></div>',card=(c,cls='')=>'<div class="playing '+(red(c.s)?'red':'black')+' '+cls+'" role="img" aria-label="'+cardName(c)+'"><span class="corner" aria-hidden="true">'+short(c.n)+'<br>'+c.s+'</span><span class="pip" aria-hidden="true">'+c.s+'</span><span class="corner bottom" aria-hidden="true">'+short(c.n)+'<br>'+c.s+'</span></div>',btn=(label,fn)=>'<button class="primary" type="button" onclick="'+fn+'">'+label+'</button>',choices=(arr)=>'<div class="actions">'+arr.map((a,i)=>'<button class="action" type="button" aria-label="'+a.label+'" onclick="select('+i+')">'+(a.html||card(a.c))+'<span>'+a.label+'</span></button>').join('')+'</div>';
let draw=deck(),current=null;function take(){if(!draw.length)draw=deck();return draw.pop()}function resetRound(){phase='ask';turn=0;question=0;history=[[],[],[]];hands=[[],[],[]];pyr=[];pyrIndex=0;station=0;failures=0;feedback='';draw=deck();current=take();render()}function start(){round=1;scores=[0,0,0];resetRound()}function questionChoices(){let prev=history[turn];if(question===0)return [{label:'Rot',c:{s:'♥',n:14}},{label:'Schwarz',c:{s:'♠',n:14}}];if(question===1)return[{label:'Höher',c:{s:'♥',n:Math.min(14,prev[0].n+1)}},{label:'Tiefer',c:{s:'♠',n:Math.max(2,prev[0].n-1)}}];if(question===2){let lo=Math.min(prev[0].n,prev[1].n),hi=Math.max(prev[0].n,prev[1].n);return[{label:'Dazwischen',html:card({s:'♥',n:Math.max(2,Math.min(14,Math.floor((lo+hi)/2)))})},{label:'Außerhalb',html:card({s:'♠',n:hi<14?14:2})}]}return suits.map(s=>({label:({'♥':'Herz','♦':'Karo','♠':'Pik','♣':'Kreuz'}[s]),c:{s,n:14}}))}
function correct(pick,c,prev,q){if(q===0)return pick===(red(c.s)?0:1);if(q===1)return pick===(c.n>prev[0].n?0:1)&&c.n!==prev[0].n;if(q===2){let lo=Math.min(prev[0].n,prev[1].n),hi=Math.max(prev[0].n,prev[1].n),inside=c.n>lo&&c.n<hi;return pick===(inside?0:1)}return suits[pick]===c.s}
function select(i){if(phase!=='ask'&&phase!=='final')return;const isFinal=phase==='final',q=isFinal?station:question,p=isFinal?driver:turn,prev=isFinal?finalHistory:history[turn],c=current,ok=correct(i,c,prev,q),label=questionChoices()[i]?.label||'';if(isFinal){if(!ok){scores[p]++;failures++}else finalHistory.push(c)}else{if(!ok)scores[p]++;history[p].push(c);hands[p].push(c)}last={p,c,ok,label,isFinal,q};feedback=names[p]+' hat '+label+' gewählt. '+cardName(c)+'. '+(ok?'Richtig.':'Falsch, ein Strafpunkt.');phase='result';render()}
function next(){if(phase!=='result')return;if(last.isFinal){if(last.ok){station++;if(station===4){phase='roundEnd';render();return}}else{station=0;finalHistory=[]}phase='final';current=take();render();return}if(turn<2)turn++;else{turn=0;question++}if(question===4){phase='pyramid';pyr=Array.from({length:10},()=>take());pyrIndex=0;feedback='';render();return}current=take();phase='ask';feedback='';render()}
function reveal(){if(phase!=='pyramid'||pyrIndex>=10)return;const c=pyr[pyrIndex],matching=[];hands.forEach((h,i)=>{let index=h.findIndex(x=>x.n===c.n);if(index>=0){h.splice(index,1);matching.push(names[i])}});pyrIndex++;feedback=cardName(c)+' aufgedeckt. '+(matching.length?matching.join(' und ')+' legen passende Handkarten ab.':'Niemand legt eine Karte ab.');phase='pyramidResult';render()}
function afterReveal(){phase=pyrIndex>=10?'selectDriver':'pyramid';feedback='';render()}
function chooseDriver(){let max=Math.max(...hands.map(x=>x.length));tieList=hands.map((x,i)=>x.length===max?i:-1).filter(i=>i>=0);if(tieList.length>1){phase='tie';tieDraws=[]}else{driver=tieList[0];beginFinal()}render()}
function drawTie(){const drawn=tieList.map(i=>({i,c:take()})),min=Math.min(...drawn.map(x=>x.c.n));tieDraws=drawn;const remaining=drawn.filter(x=>x.c.n===min).map(x=>x.i);if(remaining.length===1){driver=remaining[0];phase='tieResult'}else{tieList=remaining;phase='tieRepeat'}render()}
let finalHistory=[];function beginFinal(){phase='final';station=0;failures=0;finalHistory=[];current=take();feedback='';render()}function newRound(){round++;resetRound()}function end(){phase='done';render()}function showPoints(){el('modalTitle').textContent='Gesamtpunktestand';el('modalBody').innerHTML='<div class="scores">'+names.map((n,i)=>'<div>'+n+'<strong>'+scores[i]+'</strong>Strafpunkte</div>').join('')+'</div><p>Weniger Strafpunkte sind besser. Keine Begrenzung im Finale.</p>';el('modal').showModal()}
function render(){let status='',sub='',s='';const roundText='Runde '+round+' von 5';if(phase==='start'){status='Busfahrer';sub='Konzeptansicht · 3 Spieler';s='<div class="panel"><h2>Neue Partie</h2><p>Vier Vorhersagen reihum, danach Pyramide und Busfahrt. Die anderen Spieler werden im Prototyp auf demselben Bildschirm bedient.</p>'+btn('Partie starten','start()')+'</div>'}
if(phase==='ask'){status=names[turn]+' ist dran.';sub=roundText+' · Frage '+(question+1)+' von 4 · '+questions[question];s='<div class="panel"><div class="center">'+back()+'</div><h2>Vorhersage wählen</h2>'+choices(questionChoices())+'</div>'}
if(phase==='result'){status=names[last.p]+' hat '+last.label+' gewählt.';sub=roundText+' · '+(last.isFinal?'Busfahrt':'Frage '+(last.q+1)+' von 4');s='<div class="panel"><div class="center">'+card(last.c,'large')+'</div><div class="note"><strong>'+(last.ok?'Richtig':'Falsch · +1 Strafpunkt')+'</strong>'+cardName(last.c)+'</div>'+btn('Weiter','next()')+'</div>'}
if(phase==='pyramid'||phase==='pyramidResult'||phase==='selectDriver'){status=phase==='selectDriver'?'Busfahrer bestimmen':phase==='pyramidResult'?'Karte aufgedeckt.':'Pyramide: Karte aufdecken.';sub=roundText+' · '+pyrIndex+' von 10 Karten';let idx=0;s='<div class="panel"><div class="pyramid">'+[1,2,3,4].map(n=>'<div class="pyrrow">'+Array.from({length:n},()=>{let i=idx++;return i<pyrIndex?card(pyr[i],'small'):back()}).join('')+'</div>').join('')+'</div><p class="progress">Handkarten: '+names.map((n,i)=>n+' '+hands[i].length).join(' · ')+'</p>'+(phase==='pyramid'?btn('Nächste Karte aufdecken','reveal()'):phase==='pyramidResult'?btn('Weiter','afterReveal()'):btn('Busfahrer bestimmen','chooseDriver()'))+'</div>'}
if(phase==='tie'||phase==='tieRepeat'||phase==='tieResult'){status=phase==='tieResult'?names[driver]+' wird Busfahrer.':'Gleichstand: Entscheidungskarte.';sub=roundText+' · Stechen';s='<div class="panel"><p>Die niedrigste Karte bestimmt den Busfahrer. Bei erneutem Gleichstand ziehen nur die Betroffenen noch einmal.</p>'+ (tieDraws.length?'<div class="center">'+tieDraws.map(x=>'<div style="text-align:center">'+card(x.c,'small')+'<p>'+names[x.i]+'</p></div>').join('')+'</div>':'')+(phase==='tieResult'?btn('Busfahrt beginnen','beginFinal()'):btn('Entscheidungskarten ziehen','drawTie()'))+'</div>'}
if(phase==='final'){status=names[driver]+' fährt Bus.';sub=roundText+' · Station '+(station+1)+' von 4 · '+questions[station];s='<div class="panel"><div class="center">'+back()+'</div><h2>Vorhersage wählen</h2>'+choices(questionChoices())+'<p class="progress">Fehlversuche: '+failures+' · Jeder Fehler: +1 Strafpunkt und Neustart</p></div>'}
if(phase==='roundEnd'){status='Busfahrt geschafft!';sub=roundText+' · Rundenergebnis';s='<div class="panel"><p>'+names[driver]+' hat alle vier Stationen geschafft. Fehlversuche: '+failures+'</p>'+btn(round<5?'Nächste Runde':'Gesamtergebnis',round<5?'newRound()':'end()')+'</div>'}
if(phase==='done'){let min=Math.min(...scores);status='Partie beendet.';sub='Fünf Runden gespielt';s='<div class="panel"><h2>Ergebnis</h2><p>'+names.filter((n,i)=>scores[i]===min).join(' und ')+' '+(scores.filter(x=>x===min).length===1?'gewinnt':'gewinnen')+' mit '+min+' Strafpunkten.</p>'+btn('Neue Partie','start()')+'</div>'}
el('status').textContent=status;el('sub').textContent=sub;el('screen').innerHTML=s;el('summary').innerHTML='<button type="button" onclick="showPoints()" aria-label="Spielstand anzeigen">Spielstand <span aria-hidden="true">›</span></button><strong>'+names[0]+': '+scores[0]+' · '+names[1]+': '+scores[1]+' · '+names[2]+': '+scores[2]+'</strong>';el('announce').textContent=feedback}
el('restart').onclick=()=>{if(confirm('Neue Partie starten?'))start()};el('points').onclick=showPoints;el('rules').onclick=()=>{el('modalTitle').textContent='Spielregeln';el('modalBody').innerHTML='<p>Alle Spieler beantworten vier Vorhersagen reihum. Falsche Antworten kosten einen Strafpunkt. Danach werden zehn Pyramidenkarten aufgedeckt. Wer die meisten Handkarten behält, fährt Bus. Bei Gleichstand entscheidet die niedrigste gezogene Karte. Jede falsche Vorhersage bei der Busfahrt kostet einen Strafpunkt und setzt die Fahrt auf Station 1 zurück. Nach fünf Runden gewinnt der niedrigste Gesamtstand.</p>';el('modal').showModal()};el('closeModal').onclick=()=>el('modal').close();render();
</script></body></html>

<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mitgemischt – Schwimmen Klickdummy</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#071b30;color:white}main{max-width:680px;margin:auto;padding:16px 14px 48px}h1{font-size:1.5rem;margin:4px 0}h2{font-size:1.08rem}button{font:inherit;cursor:pointer;color:white;background:#155b99;border:1px solid #65baff;border-radius:12px;padding:12px}button:disabled{opacity:.38;cursor:default}button:focus-visible{outline:3px solid #ffcc38;outline-offset:3px}.panel{background:#123353;border:1px solid #315b80;border-radius:16px;padding:14px;margin:12px 0}.muted{color:#c2d7eb}.status{min-height:60px}.cards{display:flex;justify-content:center;gap:10px;margin:10px 0 16px}.card{width:min(29%,108px);aspect-ratio:.7;background:#fff;color:#18212d;border-radius:10px;border:3px solid #d4dce5;padding:9px;text-align:left;font-size:1.5rem;font-weight:800;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 3px 9px #0006}.card span:last-child{text-align:center;font-size:2.4rem}.red{color:#c32935}.card.selected{outline:4px solid #ffca40}.card:disabled{opacity:.85}.actions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.action{padding:8px 2px;min-height:76px;font-size:.72rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}.action svg{width:34px;height:34px}.action b{font-size:.69rem}.footer{color:#bed3e4;font-size:.82rem}.overlay{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;padding:20px;z-index:5}.dialog{width:min(100%,430px);background:#f7f9fc;color:#16283a;border-radius:18px;padding:22px;box-shadow:0 15px 60px #0009}.dialog button{width:100%;margin-top:10px}.dialog h2{margin-top:0}.secondary{background:#31526d}.badge{font-size:.8rem;color:#ffe58b}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.score{width:100%;border-collapse:collapse}.score td,.score th{padding:9px 5px;text-align:left;border-bottom:1px solid #45627c}.hidden{display:none!important}@media(min-width:650px){.action{font-size:.86rem}.action b{font-size:.82rem}}</style></head><body><main><div class="panel status" role="status" aria-live="polite" id="status"></div><div class="panel"><div class="top"><strong id="opponents">Teilnehmer</strong><span id="round">Runde 1</span></div><p class="muted" id="turnlabel"></p><div class="top"><h2>Offene Karten in der Mitte</h2><strong id="middlepoints"></strong></div><div id="middle" class="cards"></div><div class="top"><h2>Deine Karten</h2><strong id="points"></strong></div><div id="hand" class="cards"></div><div class="actions"><button class="action" id="all" onclick="allSwap()"><svg viewBox="0 0 40 40" aria-hidden="true"><rect x="5" y="12" width="19" height="24" rx="2" fill="#e84b4b" stroke="white" stroke-width="2"/><rect x="16" y="8" width="19" height="24" rx="2" fill="#d92d37" stroke="white" stroke-width="2"/><path d="M4 7H30l-5-5m5 5-5 5M36 36H10l5-5m-5 5 5 5" fill="none" stroke="#ffd04d" stroke-width="3"/></svg><b>Alle tauschen</b></button><button class="action" id="pass" onclick="pass()"><svg viewBox="0 0 40 40" aria-hidden="true"><rect x="5" y="7" width="18" height="25" rx="2" fill="#db4141" stroke="white" stroke-width="2"/><path d="M15 19H35m-8-8 8 8-8 8" fill="none" stroke="#ffd04d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg><b>Schieben</b></button><button class="action" id="knock" onclick="knock()"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M5 10h9v10l5-7 4 1 3-1 3 2 3 1v11c0 5-5 8-13 8H9L5 29Z" fill="#f2b776" stroke="white" stroke-width="1.5"/><path d="M4 37h32M30 6l5-4m-2 10 6-1" stroke="#ffce44" stroke-width="3"/></svg><b>Klopfen</b></button><button class="action" onclick="showScore()"><svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="9" cy="20" r="3" fill="white"/><circle cx="20" cy="20" r="3" fill="white"/><circle cx="31" cy="20" r="3" fill="white"/></svg><b>Spielaktionen</b></button></div></div><p class="footer">Konzeptdemo: Gegnerzüge, Lebenswertung und Kartenmischung werden lokal simuliert. Keine Netzwerkpartie und keine Änderung an der iOS-App. Die Karten und die Oberfläche sind Platzhalter.</p></main><div id="modal" class="overlay hidden"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><h2 id="dialogTitle"></h2><div id="dialogText"></div><div id="dialogButtons"></div></div></div><script>
const ranks=['7','8','9','10','B','D','K','A'],suits=['♠','♥','♦','♣'];let deck,hand,middle,discard,players,round,turn,selected,knocked,phase,previousFocus,allPassed;
const $=id=>document.getElementById(id);function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function newDeck(){return shuffle(suits.flatMap(s=>ranks.map(r=>r+s)))}function value(c){let r=c.slice(0,-1);return r==='A'?11:['10','B','D','K'].includes(r)?10:Number(r)}function score(a){if(a.every(c=>c.slice(0,-1)==='A'))return 32;if(a.every(c=>c.slice(0,-1)===a[0].slice(0,-1)))return 30.5;return Math.max(...suits.map(s=>a.filter(c=>c.endsWith(s)).reduce((n,c)=>n+value(c),0)))}function format(n){return String(n).replace('.',',')}function cardName(c){const r=c.slice(0,-1),s=c.slice(-1);const rank={A:'Ass',K:'König',D:'Dame',B:'Bube'}[r]||r;const suit={'♠':'Pik','♥':'Herz','♦':'Karo','♣':'Kreuz'}[s];return suit+' '+rank}function speakCards(a){return a.map(cardName).join(', ')}function refill(){if(deck.length<3&&discard.length){deck=shuffle(deck.concat(discard));discard=[]}}function draw3(){refill();return deck.splice(0,3)}function announce(s){$('status').textContent=s}function reset(){deck=newDeck();discard=[];players=[{name:'Du',lives:3,swimming:false,out:false},{name:'Teilnehmer 2',lives:3,swimming:false,out:false},{name:'Teilnehmer 3',lives:3,swimming:false,out:false}];round=1;turn=0;selected=-1;knocked=false;allPassed=0;phase='dealer';hand=draw3();middle=draw3();render();dialog('Geberentscheidung','Du bist in dieser Demonstration Geber. Möchtest du deine drei Handkarten behalten oder ungesehen gegen die verdeckte Reservehand tauschen?',[['Karten behalten',()=>{phase='play';announce('Du behältst deine Karten. Der erste reguläre Spielzug beginnt.');render()}],['Verdeckte Hand tauschen',()=>{let old=hand;hand=draw3();discard.push(...old);phase='play';announce('Du hast die verdeckte Reservehand übernommen. Der erste reguläre Spielzug beginnt.');render()}]])}function card(c,idx,area){let b=document.createElement('button');b.className='card'+(/[♥♦]/.test(c)?' red':'')+(area==='hand'&&idx===selected?' selected':'');b.setAttribute('aria-label',area==='hand'?'Handkarte '+(idx+1)+': '+cardName(c):'Mittelkarte '+(idx+1)+': '+cardName(c));b.disabled=phase!=='play'||turn!==0;b.innerHTML='<span>'+c+'</span><span aria-hidden="true">'+c.slice(-1)+'</span>';b.onclick=()=>choose(area,idx);return b}function render(){['hand','middle'].forEach(area=>{let el=$(area);el.replaceChildren();(area==='hand'?hand:middle).forEach((c,i)=>el.append(card(c,i,area)))});$('points').textContent=format(score(hand))+' Punkte';$('middlepoints').textContent=format(score(middle))+' Punkte';$('round').textContent='Runde '+round;$('opponents').textContent=players.filter(p=>!p.out).length+' aktive Teilnehmer';$('turnlabel').textContent=phase==='play'?(turn===0?'Du bist am Zug.':'Teilnehmer '+(turn+1)+' ist am Zug.'):'Rundenwechsel';['all','pass','knock'].forEach(id=>$(id).disabled=phase!=='play'||turn!==0||(id==='knock'&&knocked));if(phase==='play'&&turn===0&&!$('status').textContent)announce('Du bist am Zug. Wähle eine Handkarte und dann eine Mittelkarte oder nutze eine Aktion.')}function choose(area,i){if(area==='hand'){selected=i;announce('Handkarte '+cardName(hand[i])+' ausgewählt. Wähle die gewünschte Mittelkarte.');render();return}if(selected<0){announce('Wähle zuerst eine Handkarte.');return}let t=hand[selected];hand[selected]=middle[i];middle[i]=t;selected=-1;announce('Eine Karte getauscht. Deine Hand: '+speakCards(hand)+'. Deine Wertung: '+format(score(hand))+' Punkte.');endAction()}function allSwap(){if(phase!=='play'||turn!==0)return;[hand,middle]=[middle,hand];announce('Alle drei Karten getauscht. Deine Hand: '+speakCards(hand)+'. Deine Wertung: '+format(score(hand))+' Punkte.');endAction()}function pass(){announce('Du hast geschoben.');allPassed++;nextTurn()}function knock(){knocked=true;announce('Du hast geklopft. Die Schlussrunde beginnt.');nextTurn()}function endAction(){render();let s=score(hand);if(s>=31){phase='declare';render();dialog(s===32?'Feuer!':'31 Punkte erreicht',s===32?'Du hast drei Asse. Verkünde Feuer, um die Runde zu beenden.':'Du hast 31 Punkte. Verkünde dein Ergebnis, um die Runde zu beenden.',[[s===32?'Feuer verkünden':'31 Punkte verkünden',()=>finishRound(s===32)]]);return}allPassed=0;nextTurn()}function nextTurn(){turn=1;render();announce('Teilnehmer 2 ist am Zug. Gegneraktionen werden in dieser Demo simuliert.');dialog('Gegnerzüge simulieren','Die tatsächliche App wartet auf die anderen Geräte. Hier kannst du ihre Spielzüge überspringen und die nächste Auswertung ansehen.',[['Gegnerzüge ausführen',()=>{if(knocked){finishRound(false);return}turn=0;if(allPassed){discard.push(...middle);middle=draw3();allPassed=0;announce('Alle Teilnehmer haben geschoben. Die Mittelkarten wurden erneuert. Du bist am Zug.')}else announce('Teilnehmer 2 hat eine Karte getauscht. Teilnehmer 3 hat geschoben. Du bist am Zug.');render()}],['Runde auswerten',()=>finishRound(false)]])}function finishRound(fire){phase='result';let rivalScores=players.slice(1).map(()=>Math.floor(12+Math.random()*19));let vals=[score(hand),...rivalScores],lowest=Math.min(...vals);let losers=fire?[1,2]:vals.map((v,i)=>v===lowest?i:-1).filter(i=>i>=0);losers.forEach(i=>{let p=players[i];if(p.out)return;if(p.swimming)p.out=true;else if(p.lives>1)p.lives--;else{p.lives=0;p.swimming=true}});render();let desc='Du: '+format(vals[0])+' Punkte. Gegner: '+rivalScores.join(' und ')+' Punkte. '+(fire?'Feuer: Alle anderen verlieren ein Leben.':'Niedrigste Wertung verliert ein Leben.');dialog('Rundenergebnis',desc,[['Aktuellen Spielstand ansehen',showScore],['Nächste Runde',nextRound]])}function nextRound(){if(players.filter(p=>!p.out).length<=1){dialog('Spielende','Die Partie ist beendet.',[['Neue Partie',reset]]);return}round++;deck=newDeck();discard=[];hand=draw3();middle=draw3();selected=-1;turn=0;knocked=false;allPassed=0;phase='play';announce('Neue Runde. Du bist am Zug.');render()}function showScore(){let html='<table class="score"><thead><tr><th>Teilnehmer</th><th>Leben / Status</th></tr></thead><tbody>'+players.map(p=>'<tr><td>'+p.name+'</td><td>'+(p.out?'Ausgeschieden':p.swimming?'Schwimmt – letzte Chance':p.lives+' Leben')+'</td></tr>').join('')+'</tbody></table>';dialog('Aktueller Spielstand',html,[['Schließen',()=>{}]])}function dialog(title,body,buttons){previousFocus=document.activeElement;$('dialogTitle').textContent=title;$('dialogText').innerHTML=body;$('dialogButtons').replaceChildren();buttons.forEach(([label,fn])=>{let b=document.createElement('button');b.textContent=label;b.onclick=()=>{closeDialog();fn()};$('dialogButtons').append(b)});$('modal').classList.remove('hidden');$('dialogButtons').querySelector('button')?.focus()}function closeDialog(){$('modal').classList.add('hidden');previousFocus?.focus?.()}reset();
</script></body></html>
